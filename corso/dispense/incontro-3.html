<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corso AI · Incontri 3 e 4 — Farsi trovare dall'AI, foto e social</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif; background: #FFFFFF; color: #1D1D1F; -webkit-font-smoothing: antialiased; }

/* ============================================================
   HOME (selettore vista)
============================================================ */
.home { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }
.home-card { max-width: 720px; width: 100%; text-align: center; }
.home-kicker { font-size: 12px; color: #86868B; letter-spacing: 2.5px; font-weight: 500; margin-bottom: 18px; }
.home h1 { font-size: 44px; font-weight: 600; letter-spacing: -1.2px; line-height: 1.1; margin-bottom: 14px; }
.home h1 .accent { color: #2C5F2D; }
.home .lead { font-size: 17px; color: #6E6E73; max-width: 540px; margin: 0 auto 44px; line-height: 1.5; }
.home .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 560px; margin: 0 auto 40px; }
.home .btn { display: block; padding: 24px 20px; border: 1px solid #E5E5EA; border-radius: 14px; text-decoration: none; color: #1D1D1F; transition: all 0.15s ease; background: white; cursor: pointer; font-family: inherit; text-align: left; }
.home .btn:hover { border-color: #2C5F2D; transform: translateY(-1px); }
.home .btn .ico { font-size: 22px; margin-bottom: 8px; display: block; }
.home .btn .lbl { font-size: 13px; color: #86868B; letter-spacing: 1.5px; font-weight: 500; margin-bottom: 4px; }
.home .btn .ttl { font-size: 19px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.3px; }
.home .btn .dsc { font-size: 13px; color: #6E6E73; line-height: 1.4; }
.home .istruzioni { font-size: 13px; color: #86868B; line-height: 1.6; max-width: 540px; margin: 0 auto; padding: 20px; background: #F5F5F7; border-radius: 12px; text-align: left; }
.home .istruzioni strong { color: #1D1D1F; font-weight: 600; }

/* ============================================================
   VISTA PUBBLICO (slide a tutto schermo)
============================================================ */
.pubblico { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; background: #FFFFFF; overflow: hidden; cursor: none; }
.pubblico:hover { cursor: default; }
.slide { width: 100%; height: 100%; max-width: 1600px; aspect-ratio: 16/9; background: #FFFFFF; padding: 5vmin 6vmin; position: relative; display: flex; align-items: center; justify-content: center; }
.slide.tema-scuro { background: #1D1D1F; color: #FFFFFF; }

.kicker { position: absolute; top: 4vmin; left: 6vmin; font-size: 1.3vmin; color: #86868B; letter-spacing: 0.3em; font-weight: 500; }
.brand { position: absolute; bottom: 3.5vmin; right: 6vmin; font-size: 1.3vmin; color: #B8B8BD; letter-spacing: 0.15em; }
.tema-scuro .kicker { color: rgba(255,255,255,0.4); }
.tema-scuro .brand { color: rgba(255,255,255,0.35); }

/* layout: title */
.l-title { text-align: center; }
.l-title h1 { font-size: 6.5vmin; font-weight: 600; line-height: 1.05; letter-spacing: -0.04em; margin-bottom: 2.5vmin; }
.l-title h1 .accent { color: #2C5F2D; }
.tema-scuro .l-title h1 .accent { color: #30D158; }
.l-title .sub { font-size: 2.1vmin; color: #6E6E73; font-weight: 400; }
.tema-scuro .l-title .sub { color: rgba(255,255,255,0.55); }

/* layout: question */
.l-question h1 { font-size: 5.5vmin; font-weight: 500; line-height: 1.15; letter-spacing: -0.025em; max-width: 75vw; }
.l-question h1 em { font-style: normal; color: #2C5F2D; }
.tema-scuro .l-question h1 em { color: #30D158; }

/* layout: big-word */
.l-big-word { text-align: center; }
.l-big-word .label { font-size: 1.7vmin; color: #86868B; letter-spacing: 0.3em; margin-bottom: 3vmin; font-weight: 500; }
.l-big-word .word { font-size: 12vmin; font-weight: 700; letter-spacing: -0.06em; line-height: 1; }
.l-big-word .word .strike { color: #D2D2D7; text-decoration: line-through; text-decoration-thickness: 0.4vmin; }

/* layout: three-points */
.l-three { width: 100%; max-width: 90vw; }
.l-three .h { font-size: 2.8vmin; font-weight: 500; color: #6E6E73; margin-bottom: 4vmin; letter-spacing: -0.015em; }
.l-three .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4vmin; }
.l-three .n { font-size: 1.7vmin; color: #2C5F2D; font-weight: 500; letter-spacing: 0.15em; margin-bottom: 1.2vmin; }
.l-three .t { font-size: 2.4vmin; font-weight: 500; line-height: 1.25; letter-spacing: -0.015em; }

/* layout: metafora-intro (apertura due-personaggi) */
.l-metafora-intro { text-align: center; }
.l-metafora-intro .occhiello { font-size: 2.2vmin; color: #6E6E73; font-weight: 400; margin-bottom: 3vmin; letter-spacing: -0.01em; }
.l-metafora-intro h1 { font-size: 7vmin; font-weight: 600; line-height: 1.05; letter-spacing: -0.04em; }
.l-metafora-intro h1 .accent { color: #2C5F2D; }
.tema-scuro .l-metafora-intro h1 .accent { color: #30D158; }

/* layout: figura (icona grande + titolo + sub) */
.l-figura { text-align: center; max-width: 80vw; }
.l-figura .icona { font-size: 14vmin; line-height: 1; margin-bottom: 3vmin; filter: grayscale(0.15); }
.l-figura h1 { font-size: 6vmin; font-weight: 600; line-height: 1.05; letter-spacing: -0.035em; margin-bottom: 2.5vmin; }
.l-figura .sub { font-size: 2.4vmin; color: #6E6E73; font-weight: 400; line-height: 1.5; max-width: 70vw; margin: 0 auto; }
.tema-scuro .l-figura .sub { color: rgba(255,255,255,0.55); }

/* layout: frase (citazione grande, accent verde) */
.l-frase { text-align: center; max-width: 90vw; }
.l-frase .frase { font-size: 7.5vmin; font-weight: 600; line-height: 1.05; letter-spacing: -0.04em; margin-bottom: 4vmin; }
.l-frase .frase .accent { color: #2C5F2D; }
.tema-scuro .l-frase .frase .accent { color: #30D158; }
.l-frase .sotto { font-size: 4vmin; font-weight: 400; color: #1D1D1F; line-height: 1.2; letter-spacing: -0.025em; }
.l-frase .sotto strong { font-weight: 600; }
.tema-scuro .l-frase .sotto { color: #FFFFFF; }

/* layout: ponte (transizione tra segmenti) */
.l-ponte { text-align: center; max-width: 85vw; }
.l-ponte .occhiello { font-size: 2.2vmin; color: #6E6E73; font-style: italic; margin-bottom: 2.8vmin; letter-spacing: -0.01em; }
.l-ponte h1 { font-size: 6.5vmin; font-weight: 600; line-height: 1.05; letter-spacing: -0.035em; margin-bottom: 3vmin; }
.l-ponte .sub { font-size: 2.4vmin; color: #6E6E73; font-weight: 400; line-height: 1.4; }
.tema-scuro .l-ponte .occhiello, .tema-scuro .l-ponte .sub { color: rgba(255,255,255,0.55); }

/* layout: mappa-centro (sistema PMS + satelliti) */
.l-mappa { width: 100%; max-width: 95vw; display: grid; grid-template-columns: 1fr 1.2fr; gap: 4vmin; align-items: center; }
.l-mappa .testo h1 { font-size: 5.5vmin; font-weight: 600; line-height: 1.05; letter-spacing: -0.035em; }
.l-mappa .testo h1 .accent { color: #2C5F2D; }
.l-mappa .mappa-svg { width: 100%; height: auto; max-height: 70vmin; }
/* PMS centrale */
.mappa-svg .pms-circle { fill: #1D1D1F; }
.mappa-svg .pms-label { fill: #FFFFFF; font-size: 22px; font-weight: 600; letter-spacing: 1px; }
.mappa-svg .pms-sub { fill: rgba(255,255,255,0.6); font-size: 12px; font-weight: 500; letter-spacing: 1.5px; }
/* Satelliti spenti */
.mappa-svg .sat-circle { fill: #F5F5F7; stroke: #E5E5EA; stroke-width: 1.5; transition: all 0.5s ease; }
.mappa-svg .sat-label { fill: #C7C7CC; font-size: 15px; font-weight: 500; transition: fill 0.5s ease; }
.mappa-svg .sat-sub { fill: #D2D2D7; font-size: 11px; font-weight: 400; transition: fill 0.5s ease; }
.mappa-svg .sat-link { stroke: #E5E5EA; stroke-width: 1.5; stroke-dasharray: 4,4; opacity: 0.5; transition: all 0.5s ease; }
/* Satelliti attivi */
.mappa-svg .sat-on .sat-circle { fill: #FFFFFF; stroke: #2C5F2D; stroke-width: 2; }
.mappa-svg .sat-on .sat-label { fill: #1D1D1F; }
.mappa-svg .sat-on .sat-sub { fill: #6E6E73; }
.mappa-svg .link-on { stroke: #2C5F2D; stroke-width: 2; stroke-dasharray: none; opacity: 1; }
/* Stato "completa" — accentuazione finale */
.mappa-svg.completa .pms-circle { fill: #1D1D1F; }
.mappa-svg.completa .sat-on .sat-circle { fill: #F0F7F0; stroke: #2C5F2D; stroke-width: 2; }

/* layout: confronto (due colonne prima/dopo) */
.l-confronto { width: 100%; max-width: 92vw; }
.l-confronto .titolo-c { font-size: 5vmin; font-weight: 600; text-align: center; letter-spacing: -0.035em; margin-bottom: 5vmin; }
.l-confronto .titolo-c .accent { color: #2C5F2D; }
.l-confronto .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 4vmin; }
.l-confronto .col { padding: 4vmin; border-radius: 2vmin; }
.l-confronto .col.no { background: #FBF3F2; border: 1.5px solid #F0D5D2; }
.l-confronto .col.si { background: #F0F7F0; border: 1.5px solid #C9E3C9; }
.l-confronto .col.neutro { background: #F5F5F7; border: 1.5px solid #E5E5EA; }
.l-confronto .col-label { font-size: 1.5vmin; font-weight: 600; letter-spacing: 0.12em; margin-bottom: 2vmin; display: flex; align-items: center; gap: 1vmin; }
.l-confronto .col.no .col-label { color: #C0392B; }
.l-confronto .col.si .col-label { color: #2C5F2D; }
.l-confronto .col.neutro .col-label { color: #6E6E73; }
.l-confronto .col-segno { font-size: 2.4vmin; line-height: 1; }
.l-confronto .col-testo { font-size: 2.5vmin; line-height: 1.4; color: #1D1D1F; letter-spacing: -0.01em; }

/* layout: caso (struttura partecipante) */
.l-caso { width: 100%; max-width: 80vw; }
.l-caso .nome { font-size: 6vmin; font-weight: 600; letter-spacing: -0.04em; margin-bottom: 1.5vmin; }
.l-caso .tratto { font-size: 3vmin; font-weight: 500; color: #1D1D1F; line-height: 1.25; letter-spacing: -0.02em; margin-bottom: 4vmin; padding-bottom: 4vmin; border-bottom: 1.5px solid #E5E5EA; }
.l-caso .ai-label { font-size: 1.5vmin; font-weight: 600; letter-spacing: 0.12em; color: #2C5F2D; margin-bottom: 1.5vmin; }
.l-caso .ai-testo { font-size: 2.6vmin; line-height: 1.45; color: #6E6E73; letter-spacing: -0.01em; }

/* ============================================================
   NUOVI LAYOUT PRATICI (demo / coinvolgimento / checkpoint)
   Tutte queste slide lasciano LIBERO l'angolo basso-destra
   per la webcam: contenuto allineato a sinistra/alto.
============================================================ */

/* badge tipo-slide (in alto a sinistra, sotto il kicker) */
.tipo-badge { position: absolute; top: 8.5vmin; left: 6vmin; display: inline-flex; align-items: center; gap: 1vmin; font-size: 1.5vmin; font-weight: 600; letter-spacing: 0.12em; padding: 0.9vmin 1.8vmin; border-radius: 100px; }
.tipo-badge .pallino { width: 1.1vmin; height: 1.1vmin; border-radius: 50%; }
.tipo-badge.demo { background: #EAF3FB; color: #1B5E9B; }
.tipo-badge.demo .pallino { background: #1B5E9B; animation: pulsa 1.6s ease-in-out infinite; }
.tipo-badge.coinvolgimento { background: #F0F7F0; color: #2C5F2D; }
.tipo-badge.coinvolgimento .pallino { background: #2C5F2D; }
.tipo-badge.checkpoint { background: #FFF4E0; color: #B26B00; }
.tipo-badge.checkpoint .pallino { background: #E89A1C; }
@keyframes pulsa { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }

/* zona webcam riservata (riferimento visivo solo in relatore) */
.zona-webcam { position: absolute; bottom: 3vmin; right: 4vmin; width: 22vmin; height: 16vmin; border: 1.5px dashed #D2D2D7; border-radius: 1.5vmin; display: none; align-items: center; justify-content: center; color: #C7C7CC; font-size: 1.3vmin; letter-spacing: 0.1em; }
.rel-current .zona-webcam, .rel-next .zona-webcam { display: flex; }
.tema-scuro .zona-webcam { border-color: rgba(255,255,255,0.18); color: rgba(255,255,255,0.3); }

/* layout: demo ("ora guardate") */
.l-demo { width: 100%; max-width: 70vw; align-self: center; text-align: left; padding-bottom: 4vmin; }
.l-demo h1 { font-size: 5.5vmin; font-weight: 600; line-height: 1.06; letter-spacing: -0.035em; margin-bottom: 3vmin; }
.l-demo h1 .accent { color: #2C5F2D; }
.tema-scuro .l-demo h1 .accent { color: #30D158; }
.l-demo .guardate { font-size: 2.4vmin; color: #6E6E73; font-weight: 400; line-height: 1.45; max-width: 60vw; }
.tema-scuro .l-demo .guardate { color: rgba(255,255,255,0.6); }
.l-demo .schermo-hint { margin-top: 4vmin; display: inline-flex; align-items: center; gap: 1.4vmin; font-size: 1.7vmin; color: #1B5E9B; font-weight: 500; }
.l-demo .schermo-hint .freccia { font-size: 2.2vmin; }

/* layout: coinvolgimento ("provate voi / ditemi voi") */
.l-coinvolgi { width: 100%; max-width: 72vw; text-align: left; }
.l-coinvolgi .occhiello { font-size: 2vmin; color: #2C5F2D; font-weight: 600; letter-spacing: 0.08em; margin-bottom: 2.5vmin; }
.l-coinvolgi h1 { font-size: 6vmin; font-weight: 600; line-height: 1.06; letter-spacing: -0.038em; margin-bottom: 3.5vmin; }
.l-coinvolgi h1 .accent { color: #2C5F2D; }
.tema-scuro .l-coinvolgi h1 .accent { color: #30D158; }
.l-coinvolgi .compito { font-size: 2.6vmin; color: #1D1D1F; font-weight: 400; line-height: 1.4; max-width: 60vw; padding: 3vmin 3.5vmin; background: #F0F7F0; border-left: 0.6vmin solid #2C5F2D; border-radius: 1.2vmin; }
.tema-scuro .l-coinvolgi .compito { background: rgba(48,209,88,0.08); color: #FFFFFF; }

/* layout: checkpoint ("ci siete? domande?") */
.l-checkpoint { text-align: center; max-width: 80vw; }
.l-checkpoint .icona { font-size: 9vmin; line-height: 1; margin-bottom: 2.5vmin; }
.l-checkpoint h1 { font-size: 6.5vmin; font-weight: 600; line-height: 1.05; letter-spacing: -0.04em; margin-bottom: 2.5vmin; }
.l-checkpoint h1 .accent { color: #2C5F2D; }
.tema-scuro .l-checkpoint h1 .accent { color: #30D158; }
.l-checkpoint .sub { font-size: 2.3vmin; color: #6E6E73; font-weight: 400; line-height: 1.45; max-width: 60vw; margin: 0 auto; }
.tema-scuro .l-checkpoint .sub { color: rgba(255,255,255,0.55); }

/* badge "cuscinetto" (slide opzionale di riserva) */
.cuscinetto-tag { position: absolute; top: 4vmin; right: 6vmin; font-size: 1.2vmin; font-weight: 600; letter-spacing: 0.14em; color: #C7C7CC; border: 1px solid #E5E5EA; padding: 0.6vmin 1.4vmin; border-radius: 100px; }

/* pubblico waiting */
.pubblico-attesa { text-align: center; color: #86868B; font-size: 16px; }
.pubblico-attesa h2 { font-size: 28px; color: #1D1D1F; font-weight: 500; margin-bottom: 10px; letter-spacing: -0.5px; }

/* ============================================================
   VISTA RELATORE
============================================================ */
.relatore { width: 100vw; min-height: 100vh; background: #F5F5F7; padding: 16px; display: grid; grid-template-columns: 1.4fr 1fr; grid-template-rows: auto 1fr auto auto; gap: 14px; }

.rel-header { grid-column: 1 / -1; background: white; border-radius: 12px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #E5E5EA; }
.rel-header .titolo { font-size: 14px; font-weight: 600; }
.rel-header .titolo .sub { color: #86868B; font-weight: 400; margin-left: 10px; }
.rel-header .stato { display: flex; gap: 18px; align-items: center; font-size: 13px; color: #6E6E73; }
.rel-header .stato .live { display: inline-flex; align-items: center; gap: 6px; }
.rel-header .stato .live .dot { width: 7px; height: 7px; background: #34C759; border-radius: 50%; }
.rel-header .stato .live.off .dot { background: #FF3B30; }
.rel-header .timer { font-variant-numeric: tabular-nums; font-weight: 500; color: #1D1D1F; font-size: 14px; }

.rel-current { grid-row: 3; background: white; border-radius: 12px; padding: 14px; border: 1px solid #E5E5EA; display: flex; flex-direction: column; }
.rel-current .lbl { font-size: 11px; color: #86868B; letter-spacing: 0.15em; font-weight: 500; margin-bottom: 8px; }
.rel-current .frame { aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; border: 1px solid #E5E5EA; }
.rel-current .frame .slide { padding: 2.8vmin 3.4vmin; }
.rel-current .frame .slide h1 { font-size: 3.5vmin !important; }
.rel-current .frame .slide .word { font-size: 6vmin !important; }
.rel-current .frame .slide .sub, .rel-current .frame .slide .h, .rel-current .frame .slide .t, .rel-current .frame .slide .label, .rel-current .frame .slide .occhiello, .rel-current .frame .slide .sotto { font-size: 1.3vmin !important; }
.rel-current .frame .slide .frase { font-size: 4vmin !important; }
.rel-current .frame .slide .titolo-c { font-size: 2.6vmin !important; margin-bottom: 2vmin !important; }
.rel-current .frame .slide .col { padding: 2vmin !important; }
.rel-current .frame .slide .col-testo { font-size: 1.5vmin !important; }
.rel-current .frame .slide .col-label { font-size: 1vmin !important; }
.rel-current .frame .slide .col-segno { font-size: 1.4vmin !important; }
.rel-current .frame .slide .nome { font-size: 3.2vmin !important; }
.rel-current .frame .slide .tratto { font-size: 1.7vmin !important; margin-bottom: 2vmin !important; padding-bottom: 2vmin !important; }
.rel-current .frame .slide .ai-testo { font-size: 1.4vmin !important; }
.rel-current .frame .slide .ai-label { font-size: 0.9vmin !important; }
.rel-current .frame .slide .icona { font-size: 7vmin !important; margin-bottom: 1.5vmin !important; }
.rel-current .frame .slide .n { font-size: 1vmin !important; }
.rel-current .frame .kicker { font-size: 0.85vmin !important; }
.rel-current .frame .brand { font-size: 0.85vmin !important; }

.rel-next { grid-row: 3; background: white; border-radius: 12px; padding: 14px; border: 1px solid #E5E5EA; display: flex; flex-direction: column; }
.rel-next .lbl { font-size: 11px; color: #86868B; letter-spacing: 0.15em; font-weight: 500; margin-bottom: 8px; display: flex; justify-content: space-between; }
.rel-next .lbl .conta { color: #1D1D1F; }
.rel-next .frame { aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; border: 1px solid #E5E5EA; opacity: 0.6; }
.rel-next .frame .slide { padding: 2.8vmin 3.4vmin; }
.rel-next .frame .slide h1 { font-size: 3.5vmin !important; }
.rel-next .frame .slide .word { font-size: 6vmin !important; }
.rel-next .frame .slide .sub, .rel-next .frame .slide .h, .rel-next .frame .slide .t, .rel-next .frame .slide .label, .rel-next .frame .slide .occhiello, .rel-next .frame .slide .sotto { font-size: 1.3vmin !important; }
.rel-next .frame .slide .frase { font-size: 4vmin !important; }
.rel-next .frame .slide .titolo-c { font-size: 2.6vmin !important; margin-bottom: 2vmin !important; }
.rel-next .frame .slide .col { padding: 2vmin !important; }
.rel-next .frame .slide .col-testo { font-size: 1.5vmin !important; }
.rel-next .frame .slide .col-label { font-size: 1vmin !important; }
.rel-next .frame .slide .col-segno { font-size: 1.4vmin !important; }
.rel-next .frame .slide .nome { font-size: 3.2vmin !important; }
.rel-next .frame .slide .tratto { font-size: 1.7vmin !important; margin-bottom: 2vmin !important; padding-bottom: 2vmin !important; }
.rel-next .frame .slide .ai-testo { font-size: 1.4vmin !important; }
.rel-next .frame .slide .ai-label { font-size: 0.9vmin !important; }
.rel-next .frame .slide .icona { font-size: 7vmin !important; margin-bottom: 1.5vmin !important; }
.rel-next .frame .slide .n { font-size: 1vmin !important; }
.rel-next .frame .kicker { font-size: 0.85vmin !important; }
.rel-next .frame .brand { font-size: 0.85vmin !important; }

.rel-note { grid-column: 1 / -1; grid-row: 2; overflow-y: auto; background: white; border-radius: 12px; padding: 18px 22px; border: 1px solid #E5E5EA; }
.rel-note .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.rel-note .head .lbl { font-size: 11px; color: #86868B; letter-spacing: 0.15em; font-weight: 500; }
.rel-note .head .segm { font-size: 13px; color: #2C5F2D; font-weight: 500; }

/* ============================================================
   RENDER MAPPA SVG (sistema PMS + satelliti)
============================================================ */
function renderMappa(c) {
  const sats = c.satelliti || [];
  const cx = 350, cy = 240, R = 165, r = 62;
  const n = sats.length || 1;
  const pts = sats.map((s, k) => { const ang = -Math.PI/2 + k * 2*Math.PI/n; return { ...s, x: cx + R*Math.cos(ang), y: cy + R*Math.sin(ang) }; });
  const links = pts.map(s => { const dx=s.x-cx, dy=s.y-cy, len=Math.sqrt(dx*dx+dy*dy), ux=dx/len, uy=dy/len;
    return `<line class="sat-link ${s.attivo?'link-on':''}" x1="${cx+ux*75}" y1="${cy+uy*75}" x2="${s.x-ux*r}" y2="${s.y-uy*r}" />`; }).join('');
  const circles = pts.map(s => `<g class="${s.attivo?'sat-on':''}">
      <circle class="sat-circle" cx="${s.x}" cy="${s.y}" r="${r}" />
      <text class="sat-label" x="${s.x}" y="${s.y-4}" text-anchor="middle" style="font-size:11.5px;letter-spacing:.5px">${s.label}</text>
      <text class="sat-sub" x="${s.x}" y="${s.y+13}" text-anchor="middle" style="font-size:9.5px">${s.sub}</text>
    </g>`).join('');
  const centro = (c.centro || 'PMS').split('<br>');
  return `<div class="l-mappa">
    <div class="testo"><h1>${c.titolo}</h1></div>
    <div>
      <svg class="mappa-svg completa" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg">
        ${links}${circles}
        <circle class="pms-circle" cx="${cx}" cy="${cy}" r="75" />
        ${centro.map((t,k)=>`<text class="pms-label" x="${cx}" y="${cy-8+k*24-(centro.length-1)*8}" text-anchor="middle" style="font-size:18px">${t}</text>`).join('')}
        <text class="pms-sub" x="${cx}" y="${cy+40}" text-anchor="middle" style="font-size:9px">${c.centroSub||''}</text>
      </svg>
    </div>
  </div>`;
}

function renderSlide(slide, live) {

      <h1>${slide.contenuto.titolo}</h1>

        </div>
      </div>
    </div>`;
  } else if (slide.layout === 'caso') {
    const c = slide.contenuto;
    inner = `<div class="l-caso">
      <div class="nome">${c.nome}</div>
      <div class="tratto">${c.tratto}</div>
      <div class="ai-label">DOVE L'AI AMPLIFICA</div>
      <div class="ai-testo">${c.ai}</div>
    </div>`;
  } else if (slide.layout === 'demo') {
    const c = slide.contenuto;
    inner = `<div class="l-demo">
      <h1>${c.titolo}</h1>
      <div class="guardate">${c.guardate}</div>
      ${c.schermo ? `<div class="schermo-hint"><span class="freccia">→</span> ${c.schermo}</div>` : ''}
    </div>`;
  } else if (slide.layout === 'coinvolgimento') {
    const c = slide.contenuto;
    inner = `<div class="l-coinvolgi">
      ${c.occhiello ? `<div class="occhiello">${c.occhiello}</div>` : ''}
      <h1>${c.titolo}</h1>
      ${c.compito ? `<div class="compito">${c.compito}</div>` : ''}
    </div>`;
  } else if (slide.layout === 'numero') {
    const c = slide.contenuto;
    inner = `<div class="l-numero"><div class="cifra">${c.cifra}</div><div class="riga">${c.riga}</div><div class="fonte">${c.fonte}</div></div>`;
  } else if (slide.layout === 'prompt') {
    const c = slide.contenuto;
    inner = `<div class="l-prompt"><h1>${c.titolo}</h1>${c.prompts.map(p => `<div class="chat"><div class="chat-label">${p.label}</div><div class="chat-testo">${p.testo}</div></div>`).join('')}</div>`;
  } else if (slide.layout === 'pianob') {
    const c = slide.contenuto;
    inner = `<div class="l-pianob"><div class="pb-tag">PIANO B · RISPOSTA DELLA PROVA</div><h1>${c.titolo}</h1>${c.immagine ? `<img src="${c.immagine}" alt="">` : `<div class="pb-vuoto">${c.attesa}</div>`}</div>`;
  } else if (slide.layout === 'checkpoint') {
    const c = slide.contenuto;
    inner = `<div class="l-checkpoint">
      <div class="icona">${c.icona || '✋'}</div>
      <h1>${c.titolo}</h1>
      ${c.sub ? `<div class="sub">${c.sub}</div>` : ''}
    </div>`;
  }
  // badge tipo-slide pratico
  const badge = {
    demo:           '<div class="tipo-badge demo"><span class="pallino"></span> ORA GUARDATE</div>',
    coinvolgimento: '<div class="tipo-badge coinvolgimento"><span class="pallino"></span> TOCCA A VOI</div>',
    checkpoint:     '<div class="tipo-badge checkpoint"><span class="pallino"></span> CHECKPOINT</div>'
  }[slide.layout] || '';
  return `<div class="slide ${temaClass}">
    ${slide.kicker ? `<div class="kicker">${slide.kicker}</div>` : ''}
    ${badge}
    ${slide.cuscinetto ? '<div class="cuscinetto-tag">RISERVA · SE SEI CORTO</div>' : ''}
    ${slide.brand ? `<div class="brand">${slide.brand}</div>` : ''}
    ${inner}
    ${(live && cdRestante(slide) !== null) ? `<div class="countdown ${cdRestante(slide) <= 60 ? 'urgente' : ''}">${formatTime(cdRestante(slide))}</div>` : ''}
    <div class="zona-webcam">WEBCAM</div>
  </div>`;
}
function cdRestante(slide) {
  if (stato.cdFine && SLIDES[stato.indice] === slide) return Math.max(0, Math.ceil((stato.cdFine - Date.now()) / 1000));
  return null;
}
function getCopia(slide) {
  if (!slide) return [];
  if (slide.copia) return slide.copia;
  if (slide.contenuto && slide.contenuto.prompts) return slide.contenuto.prompts.map(p => ({ label: p.label, testo: p.testo }));
  return [];
}

/* ============================================================
   VISTA: HOME (selettore)
============================================================ */
/* ============================================================
   VISTA: PUBBLICO
============================================================ */
let ultimoIndiceRender = -1;
function barraAvanzamento(slide) {
  const g = gruppoDi(slide);
  if (!g) return '';
  const celle = SEGMENTI.map(s => {
    const idx = FLUSSO.filter(i => !SLIDES[i].cuscinetto && SLIDES[i].segmento && s.chiavi.includes(SLIDES[i].segmento));
    let cls = 'futuro', style = '';
    const gi = SEGMENTI.indexOf(g), si = SEGMENTI.indexOf(s);
    if (si < gi) cls = 'passato';
    else if (si === gi) {
      const pos = idx.indexOf(stato.indice) + 1;
      const r = idx.length ? Math.round(100 * pos / idx.length) : 100;
      cls = 'corrente'; style = `background:linear-gradient(to right,#34C759 ${r}%,rgba(128,128,128,0.35) ${r}%)`;
    }
    return `<div class="seg ${cls}" style="flex:${s.min};${style}"></div>`;
  }).join('');
  return `<div class="barra">${celle}</div>`;
}
function renderPubblico() {
  const slide = SLIDES[stato.indice];
  if (!slide) {
    return `<div class="pubblico"><div class="pubblico-attesa">
      <h2>In attesa</h2>
      <div>La presentazione inizierà tra poco.</div>
    </div></div>`;
  }
  const anim = (ultimoIndiceRender !== stato.indice) ? 'anim' : '';
  ultimoIndiceRender = stato.indice;
  return `<div class="pubblico ${anim}">${barraAvanzamento(slide)}${renderSlide(slide, true)}</div>`;
}

/* ============================================================
   VISTA: RELATORE
============================================================ */
function minutiOra() {
  if (stato.timerSeconds > 0) return 540 + stato.timerSeconds / 60;
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
}
function hhmm(m) {
  m = Math.round(m);
  return String(Math.floor(m / 60)).padStart(2,'0') + ':' + String(m % 60).padStart(2,'0');
}
function registraEntrata() {
  const g = gruppoDi(SLIDES[stato.indice]);
  if (g && stato.entrate[g.id] == null) stato.entrate[g.id] = minutiOra();
}
function segInfo(slide) {
  const g = gruppoDi(slide);
  if (!g) return { html: `Segmento: ${slide ? slide.segmento : '—'}`, ritardo: '' };
  const now = minutiOra(), fine = g.ora + g.min, rest = Math.round(fine - now);
  const ent = stato.entrate[g.id];
  const sc = ent != null ? Math.round(ent - g.ora) : null;
  const cls = rest < 0 ? 'rosso' : (rest <= 3 ? 'arancio' : 'verde');
  const html = `${g.nome} · previsto ${hhmm(g.ora)}–${hhmm(fine)}` + (sc != null ? ` · entrato ${sc > 0 ? '+' : ''}${sc} min` : '') +
    ` · <span class="${cls}">${rest >= 0 ? 'restano ' + rest + ' min' : 'oltre di ' + (-rest) + ' min'}</span>`;
  return { html, ritardo: g.ritardo };
}
function posLabel() {
  const i = FLUSSO.indexOf(stato.indice);
  if (i < 0) return 'PIANO B';
  if (SLIDES[stato.indice].cuscinetto) return 'RISERVA · ' + (i + 1) + ' di ' + FLUSSO.length;
  return (i + 1) + ' di ' + FLUSSO.length;
}
function cdTxt() {
  if (stato.cdFine && stato.cdIndice === stato.indice) return ' · ⏲ ' + formatTime(Math.max(0, Math.ceil((stato.cdFine - Date.now()) / 1000)));
  return '';
}
function copia(i) {
  const c = getCopia(SLIDES[stato.indice])[i];
  if (!c) return;
  const ok = () => { const b = document.getElementById('cb' + i); if (b) b.textContent = 'Copiato ✓'; };
  const fallback = () => {
    const t = document.createElement('textarea'); t.value = c.testo; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); ok(); } catch (e) {} document.body.removeChild(t);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c.testo).then(ok).catch(fallback);
  else fallback();
}
function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

// Formatta le note di regia distinguendo: frasi DA DIRE (tra virgolette),
// PROMEMORIA (tra parentesi quadre), e ISTRUZIONI di regia (il resto).
function formattaNote(testo) {
  if (!testo) return '';
  // divido in paragrafi
  const paragrafi = testo.split(/\n\n/);
  return paragrafi.map(par => {
    let p = par.replace(/\n/g, '<br>');
    // PROMEMORIA: paragrafo che inizia con [ ... ] → tutto evidenziato arancione
    if (/^\s*\[/.test(par)) {
      return `<p><span class="promemoria">${p}</span></p>`;
    }
    // DA DIRE: "frase tra virgolette" → evidenziato verde
    p = p.replace(/["“]([^"”]+)["”]/g, '<span class="dire">"$1"</span>');
    const haDire = p.includes('class="dire"');
    const haProm = false;
    if (!haDire && !haProm) {
      return `<p class="regia">${p}</p>`;
    }
    return `<p>${p}</p>`;
  }).join('');
}

/* ============================================================
   AZIONI
============================================================ */
function vai(n) {
  if (n === null || n === undefined) return;
  stato.indice = n;
  stato.cdFine = null;
  registraEntrata();
  broadcasta();
  render();
}
function next() { vai(prossimoIndice(stato.indice)); }
function prev() { vai(precedenteIndice(stato.indice)); }
function toggleCd() {
  const s = SLIDES[stato.indice];
  if (!s || !s.cd) return;
  if (stato.cdFine && stato.cdIndice === stato.indice) stato.cdFine = null;
  else { stato.cdFine = Date.now() + s.cd * 1000; stato.cdIndice = stato.indice; }
  broadcasta();
  render();
}
function togglePB() {
  const s = SLIDES[stato.indice];
  if (!s) return;
  if (s.pianoB) { if (stato.ritorno != null) { const r = stato.ritorno; stato.ritorno = null; vai(r); } return; }
  if (!s.pb) return;
  const idx = SLIDES.findIndex(x => x.id === s.pb);
  if (idx < 0) return;
  stato.ritorno = stato.indice;
  vai(idx);
}
function toggleTimer() {
  stato.timerRunning = !stato.timerRunning;
  if (stato.timerRunning) { if (stato.timerSeconds === 0) stato.entrate = {}; registraEntrata(); }
  broadcasta();
  render();
}
function resetTimer() {
  stato.timerSeconds = 0;
  stato.timerRunning = false;
  stato.entrate = {};
  stato.cdFine = null;
  broadcasta();
  render();
}

setInterval(() => {
  if (stato.timerRunning) {
    stato.timerSeconds++;
    if (VIEW === 'relatore') render();
    broadcasta();
  } else if (stato.cdFine && VIEW) {
    render();
  }
}, 1000);

/* tastiera (solo relatore) */
{
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    if (e.key === 't' || e.key === 'T') { e.preventDefault(); toggleCd(); }
  });
}

/* ============================================================
   RENDER
============================================================ */
function render() {
  const app = document.getElementById('app');
  const pos = FLUSSO.indexOf(stato.indice);
  app.innerHTML = renderPubblico() + `<div class="dnav">
    <button type="button" onclick="prev()" ${pos <= 0 ? 'disabled' : ''} aria-label="Slide precedente">&larr;</button>
    <span>${pos + 1} / ${FLUSSO.length}</span>
    <button type="button" onclick="next()" ${pos >= FLUSSO.length - 1 ? 'disabled' : ''} aria-label="Slide successiva">&rarr;</button>
  </div>`;
}
let tx = null;
document.addEventListener('touchstart', (e) => { tx = e.changedTouches[0].clientX; }, { passive: true });
document.addEventListener('touchend', (e) => {
  if (tx === null) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) { dx < 0 ? next() : prev(); }
}, { passive: true });
render();
</script>
